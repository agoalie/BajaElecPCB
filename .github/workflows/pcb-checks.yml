name: PCB checks

# For every board a pull request touches: run ERC and DRC, post the results and
# the list of changes on the run's summary page, and upload the visual diff.
on:
  pull_request:
  workflow_dispatch:

jobs:
  check-boards:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0
      options: --user root
    steps:
      - name: Install git
        run: apt-get update -qq && apt-get install -y -qq git

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check and diff changed boards
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git diff --name-only "$BASE" HEAD | { grep / || true; } | cut -d/ -f1 | sort -u > changed.txt
          while IFS= read -r board; do
            ls "$board"/*.kicad_pro > /dev/null 2>&1 || continue
            python3 tools/pcbdiff.py "$board" "$BASE" HEAD > /dev/null
            cat "pcbdiff-out/$board/summary.md" >> "$GITHUB_STEP_SUMMARY"
            python3 tools/pcbcheck.py "$board" | sed '/^Full reports/d' >> "$GITHUB_STEP_SUMMARY"
          done < changed.txt
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: pcbdiff
          path: pcbdiff-out/
          if-no-files-found: ignore
          retention-days: 30
